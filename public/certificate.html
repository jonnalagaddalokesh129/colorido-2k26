<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colorido 2K26 | Certificate Generator</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#111;color:#fff;min-height:100vh}
.app{max-width:1100px;margin:auto;padding:28px 18px}
h1{margin:0 0 8px;font-size:30px}
.sub{color:#aaa;margin-bottom:24px}
.panel{background:#1b1b1b;border:1px solid #333;border-radius:14px;padding:20px;margin-bottom:22px}
label{display:block;margin:12px 0 7px;font-weight:600}
input{width:100%;padding:13px 14px;border-radius:9px;border:1px solid #444;background:#101010;color:#fff;font-size:16px}
button{margin-top:18px;padding:13px 20px;border:0;border-radius:9px;background:#fff;color:#111;font-size:16px;font-weight:700;cursor:pointer}
button:hover{opacity:.9}
#certificate{display:none;background:#fff;color:#111;position:relative;width:100%;aspect-ratio:1.414/1;overflow:hidden;border:10px solid #111;padding:7%;text-align:center}
#certificate:before{content:"";position:absolute;inset:20px;border:2px solid #111;pointer-events:none}
.logo{font-size:24px;font-weight:900;letter-spacing:3px}
.event{font-size:18px;letter-spacing:2px;margin-top:25px}
.cert-title{font-family:Georgia,serif;font-size:48px;font-weight:700;margin:28px 0 12px}
.present{font-size:17px;color:#555}
.name{font-family:Georgia,serif;font-size:42px;font-weight:700;margin:16px 0;border-bottom:1px solid #777;display:inline-block;padding:0 35px 8px}
.text{font-size:17px;line-height:1.6;max-width:760px;margin:0 auto}
.meta{display:flex;justify-content:space-between;margin:55px 8% 0;font-size:14px}
.meta div{min-width:150px;border-top:1px solid #777;padding-top:8px}
@media(max-width:700px){
 .cert-title{font-size:30px}.name{font-size:26px}.text{font-size:13px}.meta{margin-top:25px}
}
@media print{
 body{background:#fff}
 .app>*:not(#certificate){display:none!important}
 #certificate{display:block!important;width:100vw;height:70.7vw;max-height:100vh;aspect-ratio:1.414/1;border:10px solid #111}
 @page{size:A4 landscape;margin:0}
}
</style>
</head>
<body>
<div class="app">
  <div class="panel">
    <h1>🎓 Colorido 2K26 Certificate Generator</h1>
    <div class="sub">Enter the participant details and generate a certificate instantly.</div>

    <label for="name">Participant Name</label>
    <input id="name" type="text" placeholder="Enter participant name">

    <label for="event">Event</label>
    <input id="event" type="text" placeholder="Enter event name">

    <label for="achievement">Achievement / Participation</label>
    <input id="achievement" type="text" value="Certificate of Participation">

    <label for="date">Date</label>
    <input id="date" type="date">

    <button onclick="generate()">Generate Certificate</button>
  </div>

  <div id="certificate">
    <div class="logo">COLORIDO 2K26</div>
    <div class="event" id="cEvent">EVENT</div>
    <div class="cert-title">CERTIFICATE</div>
    <div class="present">This certificate is proudly presented to</div>
    <div class="name" id="cName">Participant Name</div>
    <p class="text" id="cText">For successfully participating in the event.</p>
    <div class="meta">
      <div id="cDate">Date</div>
      <div>COLORIDO 2K26</div>
    </div>
  </div>
</div>

<script>
function generate(){
  const name=document.getElementById('name').value.trim();
  const event=document.getElementById('event').value.trim();
  const achievement=document.getElementById('achievement').value.trim();
  const date=document.getElementById('date').value;

  if(!name || !event){
    alert("Please enter the participant name and event.");
    return;
  }

  document.getElementById('cName').textContent=name;
  document.getElementById('cEvent').textContent=event.toUpperCase();
  document.getElementById('cText').textContent=achievement + " in " + event + " at COLORIDO 2K26.";
  document.getElementById('cDate').textContent=date
    ? new Date(date+"T00:00:00").toLocaleDateString('en-IN',{day:'2-digit',month:'long',year:'numeric'})
    : new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'long',year:'numeric'});

  document.getElementById('certificate').style.display='block';
  setTimeout(()=>window.print(),250);
}
</script>
</body>
</html>
